<!doctype html><html lang="en" data-ui-mode="modern" data-boot="loading"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Scarab of RA</title><link rel="icon" type="image/svg+xml" href="assets/favicon.svg"><meta name="description" content="Playable prototype using the original Scarab of RA 1.4 interface and artwork."><style>
html{background:#151515}body{margin:0}
html[data-boot="loading"] .desktop,html[data-boot="loading"] #start-screen,html[data-boot="error"] .desktop,html[data-boot="error"] #start-screen{visibility:hidden}
#boot-loader{position:fixed;inset:0;z-index:1000;display:grid;place-content:center;justify-items:center;gap:18px;background:#151515;color:#eee;font:12px/1.5 monospace;letter-spacing:1px;text-align:center;padding:24px;transition:opacity .22s ease}
#boot-loader strong{font:small-caps 24px/1.2 Georgia,serif;letter-spacing:3px}#boot-message{max-width:320px;margin:0}
.boot-spinner{width:22px;height:22px;border:1px solid #777;border-top-color:#fff;border-radius:50%;animation:boot-spin 1s linear infinite}
html[data-boot="ready"] #boot-loader{opacity:0;pointer-events:none}html[data-boot="error"] .boot-spinner{display:none}
#boot-retry{padding:8px 20px;font:inherit}#boot-retry[hidden]{display:none}
@keyframes boot-spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){#boot-loader{transition:none}.boot-spinner{animation:none}}
